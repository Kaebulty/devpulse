<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DevPulse{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <a href="{% url 'dashboard-index' %}" class="text-lg font-semibold tracking-tight">DevPulse</a>
      <div class="flex items-center gap-4 text-sm">
        <span class="text-slate-600">{{ user.username }}</span>
        <span class="rounded-full px-2.5 py-0.5 text-xs font-medium {% if user.is_admin %}bg-indigo-100 text-indigo-700{% else %}bg-slate-100 text-slate-600{% endif %}">
          {{ user.get_role_display }}
        </span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="text-slate-500 hover:text-slate-800">Log out</button>
        </form>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
