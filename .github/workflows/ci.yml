name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_USER: devpulse_user
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      CORE_DB_NAME: core_db
      SERVICES_DB_NAME: services_db
      DJANGO_DB_USER: django_user
      DJANGO_DB_PASSWORD: ci-django-password
      FASTAPI_DB_USER: fastapi_user
      FASTAPI_DB_PASSWORD: ci-fastapi-password
      INTERNAL_SECRET_TOKEN: ci-internal-secret
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Start Postgres (core_db + services_db)
        run: docker compose up db -d

      - name: Wait for Postgres
        run: |
          timeout 60 bash -c \
            'until [ "$(docker inspect -f "{{.State.Health.Status}}" devpulse-db)" = "healthy" ]; do sleep 2; done'

      - name: Lint
        run: uv run ruff check .

      - name: Apply Django migrations
        run: uv run python services/django_core/manage.py migrate

      - name: Apply FastAPI migrations
        run: cd services/fastapi_registry && uv run alembic upgrade head

      - name: Test
        run: uv run pytest services
