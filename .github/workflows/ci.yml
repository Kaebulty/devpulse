name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_USER: devpulse_user
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      CORE_DB_NAME: core_db
      SERVICES_DB_NAME: services_db
      DJANGO_DB_USER: django_user
      DJANGO_DB_PASSWORD: ci-django-password
      FASTAPI_DB_USER: fastapi_user
      FASTAPI_DB_PASSWORD: ci-fastapi-password
      INTERNAL_SECRET_TOKEN: ci-internal-secret
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Driven through the Makefile rather than the underlying commands, so CI
      # exercises the same entry point developers use. This is also what verifies
      # the Makefile runs on Linux — the ticket asks for Linux and macOS, and macOS
      # is covered by local use.
      #
      # `make migrate` and `make test` both depend on dev-db, which starts Postgres
      # with --wait, so there is no separate boot-and-poll step.

      - name: Lint
        run: make lint

      - name: Migrate
        run: make migrate

      - name: Test
        run: make test
