[project]
name = "devpulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eduard Kaebulty", email = "kaebulty@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
    "aiosqlite>=0.22.1",
]

[project.scripts]
devpulse = "devpulse:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, ASYNC async pitfalls
select = ["E", "W", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Generated by Mako, not hand-written: a trailing space after "Revises:" when a
# migration has no parent, and a spare blank line where the optional ${imports}
# block renders empty. Both recur in every generated migration.
"services/fastapi_registry/alembic/versions/*" = ["W291", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services"]
